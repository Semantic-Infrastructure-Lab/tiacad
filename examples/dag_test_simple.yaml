schema_version: "3.0"

metadata:
  name: "DAG Test - Simple Dependencies"
  description: "Simple model to test dependency graph features"

parameters:
  base_size: 50
  height: 20
  thickness: 5

parts:
  base:
    primitive: box
    size: ['${base_size}', '${base_size}', '${height}']

  top:
    primitive: box
    size: ['${base_size}', '${base_size}', '${thickness}']

operations:
  stacked:
    type: boolean
    operation: union
    inputs: [base, top]

export:
  default_part: stacked

# Reviewed ground-truth contract (seeded via `tiacad audit --write-contract`,
# see docs/developer/VALIDATION_STRENGTHENING.md section 4.1).
expect:
  final: stacked
  volume: 50000.0
  bbox: [50.0, 50.0, 20.0]
  watertight: true
  components: 1
