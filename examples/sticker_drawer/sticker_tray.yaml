schema_version: "3.0"

metadata:
  name: Sticker Tray (one design per tray)
  description: >
    Single-sticker container for the 15 in x 19.5 in drawer. The default is the 6 x 6 grid:
    six columns across (78.5 mm trays + 7 x 3 mm gaps = 492 of 495 mm), six trays per
    column front to back (6 x 63.2 = 379.2 of 381 mm), 36 trays, interior 74.5 x 59.2 mm.
    Larger layouts via --set: layout B (--set tray_w=94 --set slot_l=90.6) is 5 columns of
    4 trays (20 trays) and holds any sticker within a 3.5 in (88.9 mm) diagonal; layout A
    (--set tray_w=94 --set slot_l=71.6 --set wall=1.6) is 5 columns of 5, judged not useful.
    The floor is a 20 degree ramp rising front to back so stickers tilt toward the viewer;
    finger cutouts in both walls (back one starts flush with the ramp top). Units mm.

parameters:
  tray_w: 78.5         # X, left-right. 6 trays + 7 x 3 mm gaps = 492 of 495 mm | B and A: 94.0 (5 columns)
  slot_l: 59.2         # interior Y, front-back. 6 per 381 mm at wall 2.0 | B: 90.6 (4 per column) | A: 71.6 (5)
  tray_h: 50.8         # Z. 2.00 in
  wall: 2.0            # 5 perimeter loops (PrusaSlicer packs about 0.4 mm per loop); 1.2 printed floppy on the 2/3 samples, 1.6 flimsy at full size
  floor: 2.0           # matches the wall; 10 layers at 0.2 mm
  tab_w: 40.0          # finger cutout width, front wall
  tab_floor: 14.0      # front cutout starts this far above the outside bottom
  ramp_deg: 20         # floor ramp angle, rises front to back
  ramp_rise: '${slot_l * tan(ramp_deg)}'
  back_sill: '${floor + ramp_rise}'   # back cutout starts flush with the ramp top
  tray_l: '${slot_l + 2 * wall}'

sketches:
  ramp_profile:
    plane: YZ                     # side view: sketch x = Y (front to back), sketch y = Z
    origin: [0, 0, 0]
    shapes:
      - type: polygon
        points:
          - ['${wall}', '${floor / 2}']
          - ['${wall}', '${floor}']
          - ['${wall + slot_l}', '${back_sill}']
          - ['${wall + slot_l}', '${floor / 2}']
        closed: true

parts:
  shell:
    primitive: box
    size: ['${tray_w}', '${tray_l}', '${tray_h}']
    origin: corner

  cavity:
    primitive: box
    size: ['${tray_w - 2 * wall}', '${slot_l}', '${tray_h}']
    origin:
      - '${wall}'
      - '${wall}'
      - '${floor}'

  finger_cut:
    primitive: box
    size: ['${tab_w}', '${wall * 3}', '${tray_h}']
    origin:
      - '${(tray_w - tab_w) / 2}'
      - '${-wall}'
      - '${tab_floor}'

  back_cut:
    primitive: box
    size: ['${tab_w}', '${wall * 3}', '${tray_h}']
    origin:
      - '${(tray_w - tab_w) / 2}'
      - '${tray_l - 2 * wall}'
      - '${back_sill}'

operations:
  ramp:
    type: extrude
    sketch: ramp_profile
    distance: '${tray_w}'
    direction: X

  hollow:
    type: boolean
    operation: difference
    base: shell
    subtract:
      - cavity

  with_ramp:
    type: boolean
    operation: union
    inputs:
      - hollow
      - ramp

  sticker_tray:
    type: boolean
    operation: difference
    base: with_ramp
    subtract:
      - finger_cut
      - back_cut

export:
  default_part: sticker_tray

# Closed-form contract (from the parameters, not frozen output); holds for any slot_l:
#   volume = tray_w*tray_l*tray_h - (tray_w-2*wall)*slot_l*(tray_h-floor)   # shell - cavity
#            + (tray_w-2*wall)*slot_l*ramp_rise/2                           # floor ramp wedge
#            - tab_w*wall*(tray_h-tab_floor)                                # front finger cut
#            - tab_w*wall*(tray_h-back_sill)                                # back finger cut
expect:
  final: sticker_tray
  volume: '${tray_w * tray_l * tray_h - (tray_w - 2 * wall) * slot_l * (tray_h - floor) + (tray_w - 2 * wall) * slot_l * ramp_rise / 2 - tab_w * wall * (tray_h - tab_floor) - tab_w * wall * (tray_h - back_sill)}'
  bbox: ['${tray_w}', '${tray_l}', '${tray_h}']
  watertight: true
  components: 1
  thickness: { min: 1.2 }
  tol: { volume: 0.01, length: 0.01 }
