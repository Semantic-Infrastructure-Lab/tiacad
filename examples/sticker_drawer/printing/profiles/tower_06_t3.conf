# 0.6 mm retraction tower (two pillars, ~30 mm tall): diagnostic for heat creep.
# Differs from t2: retract_length 5 -> 2, flow cap 6 -> 5, 225 -> 218 C, 2 perimeters,
# 15% gyroid. Fan 40% (off first 3 layers) as t2. Pass = both pillars fused to the top.
BASE=base/cr6se_p1.ini
MODEL=../retraction_tower.yaml
SETS=""
GCODE_NAME=TOWER_06_T3
ARGS="--duplicate 1 --nozzle-diameter 0.6 --layer-height 0.3 --first-layer-height 0.3 --extrusion-width 0.66 --perimeter-extrusion-width 0.66 --external-perimeter-extrusion-width 0.63 --infill-extrusion-width 0.66 --solid-infill-extrusion-width 0.66 --top-infill-extrusion-width 0.6 --first-layer-extrusion-width 0.63 --perimeters 2 --bottom-solid-layers 3 --top-solid-layers 3 --fill-density 15% --filament-max-volumetric-speed 5 --temperature 218 --first-layer-temperature 218 --retract-length 2 --min-fan-speed 40 --max-fan-speed 40 --disable-fan-first-layers 3"
NOTE="0.6mm retraction tower: retract 2, cap 5, 218C, fan 40%; tests heat creep via per-layer retraction"
