schema_version: "3.0"

metadata:
  name: Thing 38359 - Inside (Bore Insert) Rebuild
  description: >
    Rebuild of "Inside.stl" from Thingiverse thing:38359 ("Duck Call" by
    jamesarm97, https://www.thingiverse.com/thing:38359), using measured
    radius-vs-height samples taken from the original mesh (trimesh section
    slicing, denser near the flanged base where the profile changes fastest).
    Real part: a flanged collar (OD flares 9.30->14.32mm over the first
    3.35mm) that mates into the barrel, tapering down to a constant 7.67mm
    shaft for the rest of the 98.04mm length. The bore is a narrow air
    channel (5.58mm at the open base, tapering to a constant ~3.1mm) that
    widens into a shouldered counterbore seat (~6.1mm, z=50.3-60.3), then
    continues as a roughly-constant ~5.8mm bore for the rest of the shaft
    before tapering closed near the flat top (z~80-98). NOTE: an initial
    pass mis-measured this last section as fully solid -- a naive
    trimesh.section() at those Z heights returns a single non-circular
    entity rather than two clean nested loops (the bore there isn't quite
    axisymmetric), which looked like "no inner loop" until a cross-sectional
    *area* comparison against the solid-disk area exposed the real ~57%
    void. The circular bore radius used here is an area-equivalent
    approximation of that irregular cross-section, not its true shape. A
    small non-axisymmetric feature (likely an alignment tab/vent) was also
    measured near the top face and is not modeled -- see
    docs/developer/THINGIVERSE_IMPORT.md for how the source file was pulled
    and measured.

