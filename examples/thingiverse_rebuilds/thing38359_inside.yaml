parts:
  _placeholder:
    primitive: box
    size: [1, 1, 1]
    origin: center

operations:
  outer_solid:
    type: revolve
    sketch: exterior_profile
    axis: Z
    angle: 360

  bore_solid:
    type: revolve
    sketch: interior_profile
    axis: Z
    angle: 360

  inside:
    type: boolean
    operation: difference
    base: outer_solid
    subtract: [bore_solid]

export:
  default_part: inside
