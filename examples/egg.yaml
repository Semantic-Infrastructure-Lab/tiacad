schema_version: "3.0"

metadata:
  name: Dimensionally Accurate Egg
  description: >
    A 3D-printable egg built by revolving a biconic (two-half-ellipse) profile
    around the vertical axis. The profile is a smooth, tangent-continuous
    curve (horizontal slope at the equator on both sides) that matches a real
    chicken egg's two defining measurements: overall length and max
    diameter, plus the asymmetry ratio (how far the widest point sits from
    the blunt end vs. the pointed end). Default parameters below correspond
    to a USDA "large" chicken egg (length ~58mm, max diameter ~44mm, widest
    point ~40% of the length from the blunt end). Profile points are
    pre-computed samples of:
      r(z) = R * sqrt(1 - (z/h)^2)
    with h = blunt_length on the blunt side of the equator and
    h = pointed_length on the pointed side -- i.e. two half-ellipses of the
    same max radius R sharing a common equator, which is the standard model
    for approximating true egg ovoids. To resize, regenerate the points list
    for new length/diameter/asymmetry values rather than editing points by
    hand (see the session README / script that generated this file).
  version: "1.0"
  author: TIA

parameters:
  length: 58              # blunt tip to pointed tip, mm
  max_diameter: 44         # widest point, mm
  blunt_fraction: 0.40     # fraction of length from blunt end to the equator

