schema_version: "3.0"

metadata:
  name: "Multi-Material 3D Printing Demo"
  description: "Showcases TiaCAD's 3MF export with multiple materials and colors"
  version: "1.0"
  author: "TIA"

# Define color palette for the project
colors:
  brand-blue: "#0066CC"
  brand-orange: "#FF6600"
  accent-green: "#00CC66"

parts:
  # Base plate - Aluminum material from library
  base_plate:
    primitive: box
    size: [120, 5, 100]
    material: aluminum

  # Main body - Brand color
  main_body:
    primitive: box
    size: [100, 30, 80]
    color: brand-blue

  # Accent strip - Different brand color
  accent_strip:
    primitive: box
    size: [100, 32, 10]
    color: brand-orange

  # Handle - TPU flexible material
  handle:
    primitive: cylinder
    radius: 8
    length: 60
    material: tpu-flexible

  # Window - Transparent with RGBA
  window:
    primitive: box
    size: [40, 2, 30]
    color: [0.0, 0.5, 1.0, 0.3]  # Blue, 30% opaque

  # Logo - Simple red
  logo:
    primitive: cylinder
    radius: 5
    length: 2
    color: red

  # Custom part with full PBR appearance
  custom_knob:
    primitive: sphere
    radius: 12
    appearance:
      color: [0.9, 0.1, 0.1]
      finish: glossy
      metalness: 0.8
      roughness: 0.2
      opacity: 1.0

export:
  default_part: custom_knob
